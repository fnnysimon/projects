<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e0d4"/>
    </linearGradient>
    <linearGradient id="joint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4850"/>
      <stop offset="1" stop-color="#2a2930"/>
    </linearGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3ea"/>
      <stop offset=".5" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#ff6b2c"/>
    </radialGradient>
  </defs>
  <!-- base -->
  <ellipse cx="280" cy="738" rx="150" ry="16" fill="#000" opacity=".18"/>
  <rect x="150" y="676" width="260" height="56" rx="28" fill="url(#joint)"/>
  <circle cx="190" cy="732" r="14" fill="#17161c"/>
  <circle cx="370" cy="732" r="14" fill="#17161c"/>
  <!-- pole -->
  <rect x="258" y="470" width="44" height="214" rx="10" fill="#3a3940"/>
  <rect x="262" y="480" width="8" height="190" rx="4" fill="#55535c"/>
  <!-- torso -->
  <rect x="170" y="300" width="220" height="190" rx="46" fill="url(#shell)"/>
  <rect x="200" y="330" width="160" height="10" rx="5" fill="#ece8dd"/>
  <circle cx="280" cy="420" r="18" fill="#ff6b2c"/>
  <circle cx="280" cy="420" r="8" fill="#fff"/>
  <!-- left arm -->
  <circle cx="160" cy="340" r="30" fill="url(#joint)"/>
  <rect x="96" y="340" width="56" height="130" rx="26" fill="url(#joint)" transform="rotate(14 124 340)"/>
  <circle cx="98" cy="476" r="24" fill="#2a2930"/>
  <rect x="62" y="476" width="50" height="110" rx="22" fill="url(#shell)" transform="rotate(-18 87 476)"/>
  <path d="M86 586 l-14 46 m24 -44 l10 46" stroke="#2a2930" stroke-width="12" stroke-linecap="round"/>
  <!-- right arm -->
  <circle cx="400" cy="340" r="30" fill="url(#joint)"/>
  <rect x="408" y="330" width="56" height="130" rx="26" fill="url(#joint)" transform="rotate(-30 436 340)"/>
  <circle cx="500" cy="438" r="24" fill="#2a2930"/>
  <rect x="478" y="380" width="50" height="104" rx="22" fill="url(#shell)" transform="rotate(-160 503 432)"/>
  <path d="M520 334 l-6 -44 m24 46 l16 -40" stroke="#2a2930" stroke-width="12" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="254" y="256" width="52" height="56" rx="14" fill="url(#joint)"/>
  <!-- head -->
  <rect x="150" y="90" width="260" height="180" rx="54" fill="url(#shell)"/>
  <rect x="176" y="118" width="208" height="124" rx="38" fill="#17161c"/>
  <rect x="222" y="152" width="34" height="56" rx="17" fill="url(#eye)"/>
  <rect x="304" y="152" width="34" height="56" rx="17" fill="url(#eye)"/>
  <circle cx="420" cy="180" r="22" fill="#d9d4c6"/>
  <circle cx="420" cy="180" r="10" fill="#8d8a80"/>
  <!-- antenna -->
  <rect x="276" y="44" width="8" height="50" rx="4" fill="#3a3940"/>
  <circle cx="280" cy="40" r="14" fill="#ff6b2c"/>
</svg>
